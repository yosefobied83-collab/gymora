<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>GYMORA</title>
  <meta name="theme-color" content="#071019" />
</head>
<body style="margin:0;background:#071019;color:#fff;font-family:system-ui,sans-serif">
  <div id="boot" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px">
    <div>
      <div style="width:58px;height:58px;margin:auto;border-radius:16px;background:#b8f524;color:#071019;display:grid;place-items:center;font-weight:900;font-size:30px">G</div>
      <h1 style="margin:14px 0 6px;font-size:22px">GYMORA</h1>
      <p style="opacity:.7;margin:0">Loading your training experience…</p>
    </div>
  </div>
  <script>
    (async()=>{
      try{
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        const r=await fetch('https://dauzhafgafhfsauhstro.supabase.co/functions/v1/gymora-clean-source?v=2&fresh=20260826-bench-inline',{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
        if(!r.ok) throw new Error('source_'+r.status);
        const html=await r.text();
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        console.error(err);
        document.getElementById('boot').innerHTML='<div><h2>GYMORA is temporarily unavailable</h2><p>Please refresh in a moment.</p></div>';
      }
    })();
  </script>
</body>
</html>
